<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecSys</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>
    <h1>Movie Recommender</h1>
    <form method="POST">
        <input type="text" name="movie" placeholder="Enter a movie title" required>
        <input type="submit" value="Recommend">
    </form>
    {% if recommendations %}
    <h2>Recommendations for "{{ movie_name }}":</h2>
    <ul>
        {% for rec in recommendations %}
        <li>{{ rec }}</li>
        {% endfor %}
    </ul>
    {% elif movie_name %}
    <p>No recommendations found. Please check the movie name.</p>
    {% endif %}
</body>

</html>
